name: Research finding or idea
description: A decode, calibration or behaviour result, or an idea to test.
labels: [research]
body:
  - type: markdown
    attributes:
      value: |
        For capture procedures and required references, see https://github.com/ds-sebastian/ars510-radar/blob/main/docs/16_routes_and_tests.md
        Use anonymous test/target labels and relative times. Keep route IDs, VINs, GPS and identifying video private; offer logs for private transfer.
  - type: textarea
    id: claim
    attributes:
      label: Claim or question
      placeholder: 0x85 cells 2/3 field 64|15 follows road curvature ahead
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Drives used (anonymous), what counted as a pass before you looked, results including negatives, and how to reproduce.
  - type: textarea
    id: capture_reference
    attributes:
      label: Capture and reference (for a recorded test)
      description: Test IDs from the route guide, anonymous target labels, relative event times, controller/filter configuration, reference method and uncertainty, clock mapping, and whether complete logs can be shared privately. State if the intended condition was unexercised.
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options: [idea / untested, candidate (○), likely (◐), confirmed (●)]
