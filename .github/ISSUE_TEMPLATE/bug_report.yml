name: Bug report
description: The installer, decoder or tools do something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, fork and version, Python version. Paste errors as text.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ars510-radar commit
      placeholder: git rev-parse --short HEAD
