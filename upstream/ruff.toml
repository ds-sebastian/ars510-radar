# opendbc's own ruff settings (opendbc pyproject.toml [tool.ruff]), so the openpilot file stays upstream-clean.
# Applies to this folder only; CI runs `ruff check upstream/`.
line-length = 160
indent-width = 2
target-version = "py311"

[lint]
preview = true
select = [
  "E", "F", "W", "PIE", "C4", "ISC", "A", "B",
  "NPY",
  "UP",
  "TRY203", "TRY400", "TRY401",
  "RUF008", "RUF100",
  "TID251",
  "PLR1704",
]
ignore = [
  "E302", "E305", "W292", "E741", "E402", "C408", "ISC003", "B027", "B024", "UP031", "NPY002", "C420",
  "E111", "E114", "E226", "E241", "E221", "E265", "E266", "E261", "E252", "E251", "E231", "E225", "E262", "C419",
]
flake8-implicit-str-concat.allow-multiline = false

[lint.flake8-tidy-imports.banned-api]
"numpy.mean".msg = "Sum and divide. np.mean is slow"
